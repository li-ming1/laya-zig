<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya 决策模型 · 贪吃蛇</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#18202b; --line:#243040;
    --fg:#e8eef5; --dim:#8a97a8; --dim2:#54606f;
    --green:#3fb950; --amber:#e3b341; --red:#f85149;
    --blue:#58a6ff; --purple:#bc8cff; --cyan:#39c5cf;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 70% -10%,#131b26 0%,var(--bg) 60%);
    color:var(--fg);font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1240px;margin:0 auto;padding:14px 18px 22px;display:flex;flex-direction:column;gap:12px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  h1 b{color:var(--green)}
  .spacer{flex:1}
  .chip{
    font:11px/1 ui-monospace,Consolas,monospace;padding:5px 9px;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap
  }
  .chip.live{color:#04150a;background:var(--green);border-color:var(--green);font-weight:700}
  .chip.think{color:#1a1300;background:var(--amber);border-color:var(--amber);font-weight:700}
  .chip.dead{color:#2a0906;background:var(--red);border-color:var(--red);font-weight:700}

  /* ---------- toolbar ---------- */
  .bar{
    display:flex;gap:7px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:9px 11px;box-shadow:var(--shadow)
  }
  .bar label{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:5px}
  select,input[type=number]{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:4px 7px;font:12px ui-monospace,Consolas,monospace
  }
  input[type=number]{width:66px}
  input[type=range]{width:110px;accent-color:var(--green)}
  button{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:6px 13px;font-size:12.5px;cursor:pointer;
    transition:background .12s,border-color .12s
  }
  button:hover:not(:disabled){border-color:#38475b;background:#202933}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--green);border-color:var(--green);color:#04150a;font-weight:700}
  button.primary:hover:not(:disabled){background:#4ac95c}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}

  /* ---------- layout ---------- */
  .row{display:grid;gap:12px}
  .row.main{grid-template-columns:auto minmax(300px,1fr)}
  .row.sub{grid-template-columns:minmax(0,2.1fr) minmax(260px,1fr)}
  @media (max-width:920px){.row.main,.row.sub{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:12px 14px;box-shadow:var(--shadow);min-width:0}
  .card h2{font-size:11px;margin:0 0 9px;color:var(--dim);font-weight:700;
           text-transform:uppercase;letter-spacing:.9px}
  canvas{display:block}

  /* ---------- decision ---------- */
  .opts{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
  .opt{position:relative;background:var(--panel2);border:1px solid var(--line);
       border-radius:9px;padding:7px 11px;overflow:hidden;transition:border-color .15s}
  .opt .fill{position:absolute;inset:0;background:#1b2634;transform-origin:left;
             transform:scaleX(0);transition:transform .32s cubic-bezier(.3,.8,.4,1)}
  .opt.pick{border-color:var(--green);box-shadow:0 0 0 1px rgba(63,185,80,.25) inset}
  .opt.pick .fill{background:linear-gradient(90deg,#14351d,#1b4028)}
  .opt.deadly{border-color:#63241f}
  .opt.deadly.pick{border-color:var(--red);box-shadow:0 0 0 1px rgba(248,81,73,.3) inset}
  .opt.deadly.pick .fill{background:linear-gradient(90deg,#3a1512,#4a1a16)}
  .opt>*{position:relative}
  .opt .row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .opt .nm{font:13px ui-monospace,Consolas,monospace;font-weight:600;letter-spacing:.3px}
  .opt .p{font:12px ui-monospace,Consolas,monospace;color:var(--dim);min-width:46px;text-align:right}
  .opt.pick .p{color:var(--green)}
  .opt.deadly.pick .p{color:var(--red)}
  .badge{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600;letter-spacing:.3px}
  .badge.ok{color:#4ac95c;background:rgba(63,185,80,.12)}
  .badge.no{color:#ff7b72;background:rgba(248,81,73,.14)}

  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .m{background:var(--panel2);border-radius:8px;padding:6px 9px;min-width:0}
  .m .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
  .m .v{font:14px/1.35 ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m .v.warn{color:var(--amber)} .m .v.bad{color:var(--red)} .m .v.good{color:var(--green)}

  .verdict{margin-top:10px;padding:7px 10px;border-radius:8px;font-size:12.5px;
           background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:#ff9c94}
  .verdict.safe{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:#7ee787}

  /* ---------- stats ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:right;padding:4px 7px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  td.num{font:12.5px ui-monospace,Consolas,monospace}
  .strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:9px}
  .mv{width:15px;height:15px;border-radius:4px;background:#1d2634;color:var(--dim);
      font:10px/15px ui-monospace,Consolas,monospace;text-align:center}
  .mv.died{background:rgba(248,81,73,.18);color:#ff9c94}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .prog{height:5px;background:#1d2634;border-radius:3px;overflow:hidden;margin-top:9px}
  .prog>i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
  .empty{color:var(--dim2);font-size:12.5px;padding:14px 0;text-align:center}

  /* thinking bar */
  .thinkbar{height:3px;background:#1d2634;border-radius:2px;overflow:hidden;margin-top:10px;display:none}
  .thinkbar.on{display:block}
  .thinkbar>i{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--amber),transparent);
              animation:slide 1.1s linear infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}

  details{margin-top:2px}
  summary{cursor:pointer;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:700}
  pre{background:#080c11;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
      overflow:auto;max-height:260px;font:11.5px/1.5 ui-monospace,Consolas,monospace;
      color:#aebbc9;white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Laya 决策模型 · <b>贪吃蛇</b></h1>
    <span class="chip" id="c-policy">—</span>
    <span class="spacer"></span>
    <span class="chip" id="c-status">准备中</span>
  </header>

  <div class="bar">
    <label>决策者
      <select id="policy">
        <option value="model">Laya 模型</option>
        <option value="greedy">贪心基线</option>
        <option value="random">随机基线</option>
      </select>
    </label>
    <label>棋盘 <input type="number" id="size" value="8" min="6" max="20"></label>
    <label>种子 <input type="number" id="seed" value="12345"></label>
    <label>步间隔 <input type="range" id="speed" min="0" max="900" step="30" value="0">
      <span class="chip" id="c-speed">0ms</span></label>
    <div class="sep"></div>
    <button class="primary" id="b-play">开始</button>
    <button id="b-step">单步</button>
    <button id="b-reset">重开</button>
    <div class="sep"></div>
    <label>对比 <input type="number" id="bn" value="5" min="1" max="50"> 局</label>
    <button id="b-bench">跑对比</button>
  </div>

  <div class="row main">
    <div class="card">
      <h2>棋盘</h2>
      <canvas id="board" width="418" height="418"></canvas>
      <div class="thinkbar" id="think"><i></i></div>
    </div>

    <div class="card">
      <h2>这一步的决策</h2>
      <div id="dec"><div class="empty">按「开始」或「单步」</div></div>
    </div>
  </div>

  <div class="row sub">
    <div class="card">
      <h2>四个方向的概率随时间</h2>
      <canvas id="tl" width="760" height="132" style="width:100%"></canvas>
      <div class="legend">
        <span><i style="background:var(--blue)"></i>up</span>
        <span><i style="background:var(--purple)"></i>down</span>
        <span><i style="background:var(--amber)"></i>left</span>
        <span><i style="background:var(--green)"></i>right</span>
        <span><i style="background:#5b6674"></i>置信度</span>
      </div>
    </div>

    <div class="card">
      <h2>统计</h2>
      <div id="st"><div class="empty">—</div></div>
    </div>
  </div>

  <details>
    <summary>模型看到的文本（state）</summary>
    <pre id="prompt">—</pre>
  </details>
</div>

<script>
"use strict";

const DIRS  = ["up", "down", "left", "right"];
const ARROW = { up: "↑", down: "↓", left: "←", right: "→" };
const COLOR = { up: "#58a6ff", down: "#bc8cff", left: "#e3b341", right: "#3fb950" };

const $ = id => document.getElementById(id);
const S = {
  game: null, playing: false, busy: false, timer: null,
  speed: 0, history: [], stat: null, bench: null, paint: 0,
};

function setStatus(text, cls) {
  const c = $("c-status");
  c.textContent = text;
  c.className = "chip" + (cls ? " " + cls : "");
}

async function api(path) {
  const r = await fetch(path, { method: "POST" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

const policy = () => $("policy").value;

function blankStat() { return { games: 0, score: 0, best: 0, wall: 0, self: 0, moves: 0, conf: 0, ms: 0 }; }

/* ------------------------------------------------------------------ control */

async function reset() {
  stop();
  S.busy = false;
  setStatus("加载中…", "think");
  const q = `?size=${$("size").value}&seed=${$("seed").value}&policy=${policy()}`;
  try {
    const g = await api("/api/new" + q);
    S.game = g;
    S.history = [];
    $("c-policy").textContent = policy() === "model" ? "Laya 模型" : policy() + " 基线";
    setStatus(g.alive ? "就绪" : "结束");
    paint();
  } catch (e) {
    setStatus("加载失败", "dead");
  }
}

async function step() {
  if (S.busy || !S.game || !S.game.alive) return;
  S.busy = true;
  const slow = policy() === "model";
  if (slow) {
    setStatus("模型推理中", "think");
    $("think").classList.add("on");
  }
  $("b-step").disabled = true;

  let g = null;
  try {
    g = await api("/api/step?prompt=1");
    S.game = g;
    if (g.last) S.history.push(Object.assign({}, g.last, { fatal: g.fatal.slice() }));
    if (S.history.length > 500) S.history.shift();
    tally(g);
  } catch (e) {
    setStatus("请求失败", "dead");
  }

  S.busy = false;
  $("think").classList.remove("on");
  $("b-step").disabled = false;

  if (g) {
    setStatus(!g.alive ? (g.death === "wall" ? "撞墙了" : "咬到自己") : "就绪",
              !g.alive ? "dead" : null);
  }
  paint();
  return !!(g && g.alive);
}

function tally(g) {
  if (!S.stat) S.stat = blankStat();
  const s = S.stat;
  if (g.last) {
    s.moves++;
    s.conf += g.last.conf;
    s.ms += g.last.ms;
  }
  if (!g.alive) {
    s.games++;
    s.score += g.score;
    s.best = Math.max(s.best, g.score);
    if (g.death === "wall") s.wall++;
    else if (g.death === "self") s.self++;
  }
}

function stop() {
  S.playing = false;
  if (S.timer) { clearTimeout(S.timer); S.timer = null; }
  $("b-play").textContent = "开始";
}

function play() {
  S.playing = true;
  $("b-play").textContent = "暂停";
  loop();
}

async function loop() {
  if (!S.playing) return;
  const alive = await step();
  if (!S.playing) return;
  if (!alive) {                       // auto next game
    await new Promise(r => setTimeout(r, 700));
    if (!S.playing) return;
    $("seed").value = (parseInt($("seed").value, 10) || 1) + 1;
    await reset();
    if (!S.playing) return;
    S.playing = true;
    $("b-play").textContent = "暂停";
  }
  S.timer = setTimeout(loop, S.speed);
}

/* ------------------------------------------------------------------ paint */

function paint() {
  drawBoard();
  drawDecision();
  drawTimeline();
  drawStats();
  $("prompt").textContent = (S.game && S.game.prompt) ? S.game.prompt : "—";
}

function drawBoard() {
  const cv = $("board");
  const ctx = cv.getContext("2d");
  const g = S.game;
  const size = g ? g.size : (parseInt($("size").value, 10) || 8);
  const W = cv.width, H = cv.height;
  const pad = 7;
  const cell = Math.floor((Math.min(W, H) - pad * 2) / size);
  const ox = Math.round((W - cell * size) / 2);
  const oy = Math.round((H - cell * size) / 2);
  const X = c => ox + c * cell;
  const Y = r => oy + r * cell;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0e141c";
  ctx.beginPath(); ctx.roundRect(ox - pad, oy - pad, cell * size + pad * 2, cell * size + pad * 2, 11); ctx.fill();
  ctx.strokeStyle = "#1b2430"; ctx.lineWidth = 1;
  ctx.stroke();

  // dotted grid
  ctx.fillStyle = "#1b2430";
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    const cx = X(c) + cell / 2, cy = Y(r) + cell / 2;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(1, cell * 0.045), 0, 6.2832); ctx.fill();
  }
  if (!g) return;

  // food with a breathing glow
  const [fr, fc] = g.food;
  const t = performance.now() / 620;
  const pulse = 0.5 + 0.5 * Math.sin(t);
  const fx = X(fc) + cell / 2, fy = Y(fr) + cell / 2;
  ctx.beginPath();
  ctx.arc(fx, fy, cell * (0.30 + 0.06 * pulse), 0, 6.2832);
  ctx.fillStyle = "rgba(227,179,65,.16)"; ctx.fill();
  ctx.beginPath();
  ctx.arc(fx, fy, cell * 0.23, 0, 6.2832);
  ctx.fillStyle = "#e3b341"; ctx.fill();

  // snake: tail -> head so the head sits on top
  const n = g.snake.length;
  for (let i = n - 1; i >= 0; i--) {
    const r = g.snake[i][0], c = g.snake[i][1];
    const k = n > 1 ? i / (n - 1) : 0;
    const inset = 1.6 + k * 1.8;
    const rad = Math.max(2, cell * (i === 0 ? 0.30 : 0.24 - k * 0.07));
    ctx.beginPath();
    ctx.roundRect(X(c) + inset, Y(r) + inset, cell - inset * 2, cell - inset * 2, rad);
    if (i === 0) ctx.fillStyle = "#56d364";
    else {
      const v = Math.round(190 - 105 * k);
      ctx.fillStyle = "rgb(" + Math.round(v * .30) + "," + v + "," + Math.round(v * .45) + ")";
    }
    ctx.fill();
  }

  // eyes, looking where the snake is heading
  const h = g.snake[0];
  const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[g.dir] || [1, 0];
  const hx = X(h[1]) + cell / 2, hy = Y(h[0]) + cell / 2;
  const off = cell * 0.17, fwd = cell * 0.15, er = Math.max(1.2, cell * 0.085);
  const px = d[0] * fwd, py = d[1] * fwd;
  const nx = -d[1] * off, ny = d[0] * off;
  ctx.fillStyle = "#06301a";
  for (const s of [1, -1]) {
    ctx.beginPath(); ctx.arc(hx + px + nx * s, hy + py + ny * s, er, 0, 6.2832); ctx.fill();
  }

  if (!g.alive) {
    ctx.fillStyle = "rgba(248,81,73,.13)";
    ctx.beginPath();
    ctx.roundRect(ox - pad, oy - pad, cell * size + pad * 2, cell * size + pad * 2, 11);
    ctx.fill();
  }
}

function drawDecision() {
  const g = S.game, box = $("dec");
  if (!g || !g.last) { box.innerHTML = '<div class="empty">按「开始」或「单步」</div>'; return; }
  const L = g.last;
  const fatal = g.fatal || [false, false, false, false];
  const pick = DIRS.indexOf(L.dir);

  let html = '<div class="opts">';
  for (let i = 0; i < DIRS.length; i++) {
    const p = L.probs[i];
    const cls = "opt" + (i === pick ? " pick" : "") + (fatal[i] ? " deadly" : "");
    const tag = fatal[i] ? '<span class="badge no">会死</span>' : '<span class="badge ok">安全</span>';
    html += `<div class="${cls}">
      <div class="fill" style="transform:scaleX(${Math.max(0.004, p).toFixed(4)})"></div>
      <div class="row2">
        <span class="nm">${ARROW[DIRS[i]]} ${DIRS[i]}</span>
        ${tag}
        <span class="p">${(p * 100).toFixed(1)}%</span>
      </div></div>`;
  }
  html += "</div>";

  const m = (k, v, cls) => `<div class="m"><div class="k">${k}</div><div class="v ${cls || ""}">${v}</div></div>`;
  const pickedFatal = pick >= 0 && fatal[pick];
  html += '<div class="metrics">';
  html += m("置信度", L.conf.toFixed(3), L.conf < 0.15 ? "warn" : "");
  html += m("耗时", L.ms + "ms", L.ms > 800 ? "warn" : "");
  html += m("prompt", L.tokens + " tok");
  html += '</div>';

  if (policy() === "model") {
    html += pickedFatal
      ? '<div class="verdict">模型选了会立刻结束游戏的方向（' + L.dir + '）</div>'
      : '<div class="verdict safe">这一步选得安全</div>';
  } else {
    html += '<div class="verdict safe">基线策略：' + L.dir + '</div>';
  }
  box.innerHTML = html;
}

function drawTimeline() {
  const cv = $("tl"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const padL = 30, padR = 8, padT = 8, padB = 16;
  const gw = W - padL - padR, gh = H - padT - padB;

  ctx.font = "10px ui-monospace,Consolas,monospace";
  for (const v of [0, 0.5, 1]) {
    const y = padT + gh * (1 - v);
    ctx.strokeStyle = v === 0 ? "#243040" : "#1b2430";
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillStyle = "#54606f"; ctx.fillText(v.toFixed(1), 5, y + 3.5);
  }
  ctx.strokeStyle = "#1b2430";
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + gh); ctx.stroke();

  const h = S.history;
  if (h.length < 2) { ctx.fillStyle = "#54606f"; ctx.fillText("走几步之后这里显示四条概率曲线", padL + 10, padT + gh / 2); return; }
  const n = h.length;
  const X = i => padL + gw * (i / (n - 1));
  const Y = v => padT + gh * (1 - Math.min(1, Math.max(0, v)));

  ctx.strokeStyle = "#5b6674"; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath();
  h.forEach((L, i) => { i ? ctx.lineTo(X(i), Y(L.conf)) : ctx.moveTo(X(i), Y(L.conf)); });
  ctx.stroke(); ctx.setLineDash([]);

  for (let k = 0; k < 4; k++) {
    ctx.strokeStyle = COLOR[DIRS[k]]; ctx.lineWidth = 1.7; ctx.beginPath();
    h.forEach((L, i) => { const y = Y(L.probs[k]); i ? ctx.lineTo(X(i), y) : ctx.moveTo(X(i), y); });
    ctx.stroke();
  }
  ctx.fillStyle = "#54606f";
  ctx.fillText("最近 " + n + " 步", padL + 6, H - 3);
}

function drawStats() {
  const box = $("st");
  if (S.bench) { drawBench(); return; }
  const s = S.stat;
  if (!s || s.moves === 0) { box.innerHTML = '<div class="empty">—</div>'; return; }

  let html = `<table>
    <tr><th>决策者</th><th>局</th><th>总分</th><th>最好</th><th>撞墙</th><th>咬己</th><th>均值信度</th></tr>
    <tr>
      <td>${policy() === "model" ? "model" : policy()}</td>
      <td class="num">${s.games}</td><td class="num">${s.score}</td><td class="num">${s.best}</td>
      <td class="num">${s.wall}</td><td class="num">${s.self}</td>
      <td class="num">${(s.conf / s.moves).toFixed(3)}</td>
    </tr></table>`;

  const tail = S.history.slice(-60);
  html += '<div class="strip">' + tail.map(L => {
    const i = DIRS.indexOf(L.dir);
    const died = L.fatal && L.fatal[i];
    const tip = "p=" + L.probs.map(x => x.toFixed(2)).join(" / ") + (died ? "  会死" : "");
    return `<span class="mv${died ? " died" : ""}" title="${tip}">${ARROW[L.dir]}</span>`;
  }).join("") + "</div>";
  html += '<div class="legend"><span>最近 60 步方向，红色=这一步会死</span></div>';
  box.innerHTML = html;
}

/* ------------------------------------------------------------------ bench */

async function bench() {
  const N = Math.max(1, parseInt($("bn").value, 10) || 5);
  const size = $("size").value;
  const seed0 = parseInt($("seed").value, 10) || 1;
  const list = ["model", "greedy", "random"];
  S.bench = { running: true, done: 0, total: list.length * N, res: {} };
  $("b-bench").disabled = true;
  $("b-play").disabled = $("b-step").disabled = true;
  stop();
  drawBench();
  for (const p of list) {
    const scores = [];
    for (let i = 0; i < N; i++) {
      let g = await api(`/api/new?size=${size}&seed=${seed0 + i}&policy=${p}`);
      let guard = 0;
      while (g.alive && guard++ < 3000) g = await api("/api/step?prompt=0");
      scores.push(g.score);
      S.bench.res[p] = scores.slice();
      S.bench.done++;
      drawBench();
    }
  }
  S.bench.running = false;
  $("b-bench").disabled = false;
  $("b-play").disabled = $("b-step").disabled = false;
  drawBench();
  S.stat = null;
}

function drawBench() {
  const box = $("st"), b = S.bench;
  if (!b) return;
  const pct = Math.round(100 * b.done / b.total);
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <b>${b.running ? "对比进行中" : "对比完成"}</b>
      <span class="chip">${b.done}/${b.total}</span></div>
    <div class="prog"><i style="width:${pct}%"></i></div>`;
  const keys = Object.keys(b.res);
  if (keys.length) {
    const all = [];
    for (const k of keys) all.push.apply(all, b.res[k]);
    const max = Math.max(1, Math.max.apply(null, all));
    html += '<table style="margin-top:10px"><tr><th>决策者</th><th>均值</th><th>最好</th><th style="width:38%"></th></tr>';
    for (const p of ["model", "greedy", "random"]) {
      const sc = b.res[p];
      if (!sc) continue;
      const mean = sc.reduce((a, x) => a + x, 0) / sc.length;
      const w = Math.round(100 * mean / max);
      const col = p === "model" ? "#3fb950" : "#58a6ff";
      html += `<tr><td>${p}</td>
        <td class="num"><b>${mean.toFixed(2)}</b></td>
        <td class="num">${Math.max.apply(null, sc)}</td>
        <td><div style="background:#1d2634;border-radius:3px;height:9px">
          <i style="display:block;height:100%;width:${w}%;border-radius:3px;background:${col}"></i></div></td></tr>`;
    }
    html += "</table>";
  }
  if (b.running) html += '<div class="legend"><span>模型每步约 0.7 秒，请稍候</span></div>';
  box.innerHTML = html;
}

/* ------------------------------------------------------------------ events */

$("b-play").onclick = async () => {
  if (S.playing) { stop(); return; }
  if (!S.game || !S.game.alive) await reset();
  if (!S.game) return;
  if (!S.stat) S.stat = blankStat();
  play();
};
$("b-step").onclick = async () => {
  stop();
  if (!S.game || !S.game.alive) await reset();
  if (S.game) { if (!S.stat) S.stat = blankStat(); await step(); }
};
$("b-reset").onclick = () => { S.stat = null; S.bench = null; reset(); };
$("b-bench").onclick = bench;
$("policy").onchange = () => { S.stat = null; S.bench = null; reset(); };
$("size").onchange = () => { S.stat = null; reset(); };
$("seed").onchange = () => { S.stat = null; reset(); };
$("speed").oninput = e => { S.speed = parseInt(e.target.value, 10); $("c-speed").textContent = S.speed + "ms"; };

document.addEventListener("keydown", e => {
  const t = e.target.tagName;
  if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); $("b-play").click(); }
  else if (e.key === "s" || e.key === "S") $("b-step").click();
  else if (e.key === "r" || e.key === "R") $("b-reset").click();
});

/* 20 fps repaint, only for the food pulse and eyes */
(function tick() {
  const now = performance.now();
  if (S.game && now - S.paint > 50) { S.paint = now; drawBoard(); }
  requestAnimationFrame(tick);
})();

reset();
</script>
</body>
</html>
